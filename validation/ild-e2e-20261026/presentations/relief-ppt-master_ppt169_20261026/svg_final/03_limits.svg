    <text x="56" y="265" font-size="28" font-weight="bold" fill="#24323D">死亡</text>
    <text x="56" y="320" font-size="40" font-weight="bold" fill="#8C0D27">1/64 vs 5/63</text>
    <line x1="56" y1="353" x2="479" y2="353" stroke="#D7E0E4" stroke-width="2"/>
    <text x="56" y="403" font-size="28" font-weight="bold" fill="#24323D">严重感染类事件</text>
    <text x="56" y="458" font-size="40" font-weight="bold" fill="#8C0D27">5/64 vs 10/63</text>
    <text x="56" y="510" font-size="18" fill="#64748B">事件少，不支持生存获益或安全等效判断</text>
